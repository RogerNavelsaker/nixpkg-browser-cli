name: Build and Sign Firefox Extension

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-ext and jq
        run: sudo apt-get update && sudo apt-get install -y jq && npm install -g web-ext

      - name: Fetch upstream extension source and patch strict_min_version
        run: |
          mkdir -p extension-src
          git clone --depth 1 https://github.com/Mic92/mics-skills.git upstream
          cp -r upstream/browser-cli/extension/* extension-src/
          
          # AMO requires strict_min_version to be >= 58.0
          jq '.applications.gecko.strict_min_version = "58.0"' extension-src/manifest.json > extension-src/manifest.json.tmp
          mv extension-src/manifest.json.tmp extension-src/manifest.json
          
          echo "Patched manifest.json:"
          cat extension-src/manifest.json

      - name: Sign extension with Mozilla AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required."
            exit 1
          fi

          mkdir -p signed-dist
          web-ext sign \
            --source-dir extension-src \
            --artifacts-dir signed-dist \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

          echo "Signed artifact:"
          ls -la signed-dist/
          # Standardize name
          cp signed-dist/*.xpi signed-dist/browser-cli-controller@thalheim.io.xpi

      - name: Release Signed Extension
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v0.4.0-signed
          files: signed-dist/browser-cli-controller@thalheim.io.xpi
          generate_release_notes: true
