# .warren/triggers.yaml — scheduled automated runs for this project

- id: nightwatch-patrol
  kind: cron
  cron: '13 2 * * 0' # minute 13, staggered by project
  role: nightwatch
  timezone: UTC
  prompt: |
    Scan this repo for quality issues. Follow your procedure exactly.
    Today's date is {{date}}. If you find issues, file a plan. If the
    codebase is clean, report clean and exit.

- id: bugwatch-patrol
  kind: cron
  cron: '13 3 * * 1' # minute 13, staggered by project
  role: bugwatch
  timezone: UTC
  prompt: |
    Read the open bug queue, investigate each, and produce a plan per bug.
    Today's date is {{date}}. Cap at 3 qualifying bugs.

- id: gatewatch-patrol
  kind: cron
  cron: '13 4 * * *' # minute 13, staggered by project
  role: gatewatch
  timezone: UTC
  prompt: |
    Audit merged commit history over the last 36 hours for gate integrity,
    honest diffs, red-gate rationalizations, and ratchet exceptions.

- id: ratchetwatch-patrol
  kind: cron
  cron: '13 5 * * *' # minute 13, staggered by project
  role: ratchetwatch
  timezone: UTC
  prompt: |
    Measure quality ratchet slack (coverage floors, file-size grandfathers,
    bundle creep) and plan mechanical tightenings.

- id: tastewatch-sample
  kind: cron
  cron: '13 6 * * 0' # minute 13, staggered by project
  role: tastewatch
  timezone: UTC
  prompt: |
    Sample merged work from the past 7 days against docs/CONSTITUTION.md
    and compile a concise digest seed.

- id: documentationwatch-weekly-p7n1gdaf8ze5
  kind: cron
  cron: '09 7 * * 2'
  role: documentationwatch
  timezone: Europe/Madrid
  prompt: |
    Inspect recent merged changes and their related documentation. Update only concrete, verified documentation drift; keep edits docs-only and run available documentation checks. If documentation is current, report that without committing.
